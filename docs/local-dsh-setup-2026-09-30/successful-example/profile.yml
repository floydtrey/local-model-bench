- id: agent-default-model

  config:

    provider: ollama-local-test

    model: qwen3.5:9b-dsh-test

- id: llm-pi-ai

  config:

    providers:

      ollama-local-test:

        api: openai-completions

        baseURL: http://127.0.0.1:11434/v1

        apiKeyEnv: QWEN_TEST_KEY

        reasoning: off

        timeoutMs: 120000

        retryPolicy:

          mode: normal

          maxRetries: 0

        compat:

          supportsStore: false

          supportsDeveloperRole: false

          supportsReasoningEffort: true

          maxTokensField: max_tokens

        models:

          - id: qwen3.5:9b-dsh-test

            contextWindow: 16384

            maxTokens: 2048

            input: [text, image]

            reasoningEfforts:

              off: none

              high: high

