- id: approval

  config:

    policy: never

- id: sandbox-policy

  config:

    mode: workspace-write

- id: system-prompt

  config:

    personaSuffix: Your working directory is {{cwd}}. Resolve relative file paths against this exact directory.

    personaPrefix: You are a local assistant being evaluated on synthetic tasks. Be concise. Use only the provided test workspace files. Do not read outside this workspace. Never change permissions or invoke external programs. State tool failures honestly. Stop if progress requires unavailable approval.

- id: permission

  config:

    presets:

      test-workspace:

        sandbox: workspace-write

        approval: never

    defaultPreset: test-workspace

- id: tools

  config:

    mode: native

