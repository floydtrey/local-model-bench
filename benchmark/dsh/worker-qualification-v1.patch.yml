# Worker Qualification v1 — execution overlay
#
# Apply after role-qualification-v1.patch.yml. The base qualification overlay
# removes execution tools for Planner/Governor tests; this overlay restores only
# the bounded local capabilities needed by a Worker inside a disposable workspace.

- id: sandbox-policy
  disabled: false
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

- id: fs-sandbox
  disabled: false

- id: pwsh-sandbox
  disabled: false

# Keep interactive approval machinery out of unattended qualification runs.
# The workspace sandbox, not approval prompts, is the execution boundary.
- id: approval
  disabled: true

- id: permission
  disabled: true

- id: tool-fs
  disabled: false

- id: tool-fs-search
  disabled: false
  config:
    sampleOverCapGlobResults: false

- id: tool-pwsh
  disabled: false

# Worker qualification does not need delegation, web, or background jobs.
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-web
  disabled: true
- id: tool-jobs
  disabled: true
