# Worker Qualification v1 — execution overlay
#
# Apply after role-qualification-v1.patch.yml. The base qualification overlay
# removes execution tools for Planner/Governor tests; this overlay restores only
# the bounded local capabilities needed by a Worker inside a disposable workspace.
#
# This overlay intentionally follows the historically proven DSH tool shape:
# native tools + workspace-write sandbox + permission preset + approval never.

- id: sandbox-policy
  disabled: false
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

- id: approval
  disabled: false
  config:
    policy: never

- id: permission
  disabled: false
  config:
    presets:
      benchmark-workspace:
        sandbox: workspace-write
        approval: never
    defaultPreset: benchmark-workspace

- id: fs-sandbox
  disabled: false

- id: pwsh-sandbox
  disabled: false

- id: tools
  config:
    mode: native

- id: tool-fs
  disabled: false

- id: tool-fs-search
  disabled: false
  config:
    sampleOverCapGlobResults: false

- id: tool-pwsh
  disabled: false

# Worker qualification does not need delegation, web, or background jobs.
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-web
  disabled: true
- id: tool-jobs
  disabled: true
