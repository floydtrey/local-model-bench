# Role Qualification v1 — isolated headless benchmark overlay
#
# Applied after the current shipped dsh-base + dsh-headless bundle patches.
# Purpose: one fresh headless model session with no inherited Lab behavior.
# Model/provider settings are supplied separately per candidate.
#
# This overlay removes model-facing behavior only where possible. Core DSH
# services are left intact unless they themselves alter model behavior.

- id: system-prompt
  config:
    personaPrefix: ''
    personaSuffix: ''

# Avoid an unrelated model call for session titles.
- id: session-title-llm
  disabled: true

# No external telemetry export during benchmark runs.
- id: session-telemetry-otel
  disabled: true

# Do not inject user/project instruction files into the benchmark prompt.
- id: agent-instructions
  disabled: true

# No formal plan mode.
- id: plan-mode
  disabled: true

# No model-facing goal workflow.
- id: tool-goal
  disabled: true

# No automatic context compaction or model-visible context rewriting.
- id: compaction-basic
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: image-offload
  disabled: true

# Planner role exposes no execution or retrieval tools.
- id: tool-pwsh
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true
- id: tool-todo
  disabled: true

# No model-facing delegation/workflow tools.
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true

# Do not inject tool-repeat reminders/interventions.
- id: repeat-tool-reminder
  disabled: true

# Containment backstop. Planner should have no model-facing tools, so this
# should never affect a valid Planner run.
- id: sandbox-policy
  config:
    mode: read-only

- id: approval
  config:
    policy: never
