[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-model-bench"
version = "0.3.1"
description = "A quiet, resumable benchmark harness for local chat models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Local Model Bench contributors"}]
dependencies = []

[project.optional-dependencies]
api = ["fastapi==0.143.0", "pydantic==2.14.0", "uvicorn==0.54.0"]

[project.scripts]
local-model-bench = "localbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"localbench.database_v2" = ["migrations/*.sql"]
