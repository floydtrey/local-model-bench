name: Qualification v2 Foundation and Frozen-Source Guard
on:
  push:
    branches: [benchmark/flashnext-all-roles-v1, 'development/**']
    paths:
      - 'docs/qualification-v2/**'
      - 'docs/benchmark-lab-v2-modernization/**'
      - 'project-benchmarks/assistant-001/qualification-v2/**'
      - 'project-benchmarks/assistant-002/qualification-v2/**'
      - 'project-benchmarks/assistant-001/v1/**'
      - 'project-benchmarks/assistant-002/v1/**'
      - 'campaigns/flashnext-all-roles-v1/**'
      - 'src/localbench/qualification_v2/**'
      - 'src/localbench/assistant001/**'
      - 'src/localbench/assistant002/**'
      - 'src/localbench/v2/**'
      - 'src/localbench/database_v2/**'
      - 'tests/test_database_v2.py'
      - 'tests/test_case_publication*.py'
      - 'src/localbench/queue_gui/**'
      - 'tests/test_queue_gui*.py'
      - 'tests/results_fixtures.py'
      - 'tests/test_qualification_v2*.py'
      - 'schemas/v2/metric-report.schema.json'
      - '.github/workflows/qualification-v2-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONPATH: src
      LOCALBENCH_REQUIRE_TK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate original Assistant packets without Ollama
        run: |
          python -m localbench.assistant001 validate
          python -m localbench.assistant002 validate
      - name: Install Linux virtual display for required Tk regression coverage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Targeted T13 reporting regressions
        run: |
          python -m unittest discover -s tests -p 'test_qualification_v2_metric*.py' -v
          python -m unittest discover -s tests -p 'test_qualification_v2_legacy_reports.py' -v
      - name: Targeted real Tk Results and existing queue regressions (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p 'test_queue_gui*.py' -v
      - name: Targeted real Tk Results and existing queue regressions (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -p 'test_queue_gui*.py' -v
      - name: Full deterministic regressions including T05-T12 and frozen sources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v *> deterministic-test-output.txt
          $testExit = $LASTEXITCODE
          Get-Content deterministic-test-output.txt
          exit $testExit
      - name: Full deterministic regressions including T05-T12 and frozen sources (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a python -m unittest discover -s tests -v 2>&1 | tee deterministic-test-output.txt
      - name: Validate Planner calibration record controls (no semantic auto-grading)
        run: python -m localbench.qualification_v2 calibrate
      - name: Validate Governor calibration records without private documents or inference
        run: python -m localbench.qualification_v2.governor calibrate
      - name: Verify canonical Worker handoffs without candidate execution
        run: |
          python -m localbench.qualification_v2 worker validate --project assistant-001
          python -m localbench.qualification_v2 worker validate --project assistant-002
      - name: Validate Tester and Reviewer cases and authored annotation controls
        run: |
          python -m localbench.qualification_v2 verification validate
          python -m localbench.qualification_v2 verification calibrate
      - name: Retain deterministic test transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t16-tests-${{ matrix.os }}-python-${{ matrix.python }}
          path: deterministic-test-output.txt
          if-no-files-found: warn
          retention-days: 14
