name: Deterministic Tests

on:
  push:
    branches:
      - architecture/benchmark-lab-v2
      - architecture/construction-lab-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run full deterministic test suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee deterministic-test-output.txt

      - name: Retain deterministic test transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-tests-${{ matrix.os }}
          path: deterministic-test-output.txt
          if-no-files-found: error
          retention-days: 7
